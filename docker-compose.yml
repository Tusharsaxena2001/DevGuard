name: devguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devguard}
    ports:
      # Host 5433 because 5432 is frequently occupied by a local Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devguard} -d ${POSTGRES_DB:-devguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catch-all for alert emails (ADR-009). Nothing is delivered externally.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web inbox

  # Dev-only API container. Host port comes from API_PORT; inside the network the database is `db:5432`.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: development
      API_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-devguard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-devguard}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:5173}
      # Email alerts (API-8 minimal): sent to Mailpit; leave unset to turn alerts off.
      # nginx (the dashboard service) is the one proxy in front of the API; trust its X-Forwarded-For for rate limiting.
      TRUST_PROXY_HOPS: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Dev-only dashboard: built assets served by nginx, which proxies /v1 and /health to `api` (one origin for the browser).
  # DASHBOARD_BASE_URL must equal the published origin below so the API's CORS allow-list matches.
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
  # The agent is NOT containerised: it runs on the developer's machine against local Git repos.

volumes:
  devguard-db:
