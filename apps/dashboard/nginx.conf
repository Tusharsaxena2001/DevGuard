# Serves the built dashboard and forwards API calls, so the browser only ever talks to one origin (same as the Vite proxy:
# the session cookie is httpOnly + SameSite=Lax and no CORS is involved).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/security-headers.inc;

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # The caller's own address only: a client-supplied X-Forwarded-For is discarded, so it cannot spoof the rate-limit key.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:3000;
  }

  # Hashed build assets can be cached; index.html must not be, so a new build is picked up.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
